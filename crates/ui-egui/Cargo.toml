[package]
name = "novafilm-ui-egui"
description = "The NovaFilm egui frontend (swappable): panels, docking, timeline, monitors, control channel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
nova-ui = { workspace = true }
novafilm-time = { workspace = true }
novafilm-geom = { workspace = true }
novafilm-color = { workspace = true }
novafilm-frame = { workspace = true }
novafilm-media = { workspace = true }
novafilm-project = { workspace = true }
novafilm-tts = { workspace = true }
novafilm-edit = { workspace = true }
novafilm-render = { workspace = true }
novafilm-text = { workspace = true }
novafilm-audio-dsp = { workspace = true }
novafilm-engine = { workspace = true }
novafilm-export = { workspace = true }
novafilm-gpu = { workspace = true }
novafilm-scopes = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit"] }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
rayon = { workspace = true }
web-time = "1"
# Unicode Bidirectional Algorithm for Arabic and Hebrew captions in reading order (MIT OR Apache-2.0).
unicode-bidi = "0.3.18"
# NovaFoods wordmark (PNG) for the About dialog and Home screen.
image = { version = "0.25", default-features = false, features = ["png"] }

# Thread/process CPU clocks for frame-job profiling (safe wrappers; see frames.rs).
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "time"] }
# the same clocks on Windows (GetThreadTimes / GetProcessTimes behind a safe API; MIT OR Apache-2.0)
[target.'cfg(windows)'.dependencies]
cpu-time = "1"

[dev-dependencies]
pollster = "0.4"
novafilm-codecs = { workspace = true }
# the bench registers OS hardware decoders as the desktop app does (dev-dependency only: ui-egui
# itself stays OS-independent and web-portable)
novafilm-platform = { workspace = true }
novafilm-interchange = { workspace = true }
egui_kittest = { workspace = true, features = ["eframe", "wgpu"] }

# build.rs bakes contributors/contributors.json into the binary (About ▸ Contributors).
[build-dependencies]
serde_json = { workspace = true }
toml = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
nova-live = { git = "https://github.com/EuLucaDev/nova-live", rev = "7350e9b68e8dc447f3bc374b0762ae5eeb6d0ab5" }
