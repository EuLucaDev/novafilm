[package]
name = "novafilm-media"
description = "Media sources: probing, decoding traits, frame cache, generators, stills"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
novafilm-time = { workspace = true }
novafilm-color = { workspace = true }
novafilm-frame = { workspace = true }
novafilm-dng = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "tiff", "bmp"] }

[dev-dependencies]
novafilm-testkit = { workspace = true }
novafilm-dng = { workspace = true, features = ["writer"] }
# APNG fixtures for the animated-image tests (the image crate does not encode APNG)
png = "0.18"
